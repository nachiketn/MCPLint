version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/tools/snapshot"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: "/tools/snapshot"
    schedule:
      interval: weekly
    labels: [dependencies]
